apiVersion: apps/v1
kind: Deployment
metadata: {name: mongo, namespace: marching-cubes}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: mongo}}
  template:
    metadata: {labels: {app: mongo}}
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports: [{containerPort: 27017}]
          volumeMounts: [{name: data, mountPath: /data/db}]
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {memory: "1Gi"}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mongo-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: mongo-data, namespace: marching-cubes}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata: {name: mongo, namespace: marching-cubes}
spec:
  selector: {app: mongo}
  ports: [{port: 27017, targetPort: 27017}]
